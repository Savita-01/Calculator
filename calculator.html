<html>
<head>
<title>Calculator</title>

<style>
body {
    font-family: Arial;
    background: white;
}

.cal {
    width: 280px;
    margin: 30px auto;
    padding: 20px;
    background: #243653;
}

#display {
    width: 100%;
    height: 55px;
    margin-bottom: 25px;
    background: #aab7ca;
    border: none;
    border-radius: 12px;
    font-size: 22px;
    text-align: right;
    box-sizing: border-box;
}

.buttons {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
}

button {
    height: 55px;
    font-size: 23px;
    background: #687180;
    color: white;
    border: none;
    cursor: pointer;
}

.op {
    background: #ddd;
    color: black;
}

.equal {
    background: red;
}
</style>
</head>

<body>

<div class="cal">

<input type="text" id="display" readonly>

<div class="buttons">
<button onclick="add('1')">1</button>
<button onclick="add('2')">2</button>
<button onclick="add('3')">3</button>
<button class="op" onclick="add('+')">+</button>

<button onclick="add('4')">4</button>
<button onclick="add('5')">5</button>
<button onclick="add('6')">6</button>
<button class="op" onclick="add('-')">-</button>

<button onclick="add('7')">7</button>
<button onclick="add('8')">8</button>
<button onclick="add('9')">9</button>
<button onclick="add('%')">%</button>

<button onclick="clearAll()">[]</button>
<button onclick="add('*')">*</button>
<button class="op" onclick="add('/')">/</button>
<button class="equal" onclick="result()">=</button>
</div>
</div>

<script>
function add(v) {
    document.getElementById("display").value += v;
}

function clearAll() {
    document.getElementById("display").value = "";
}

function result() {
    let d = document.getElementById("display");

    try {
        if (!/^[0-9+\-*/%. ]+$/.test(d.value))
            throw Error();

        let ans = Function(
            '"use strict"; return (' + d.value + ')'
        )();

        if (!Number.isFinite(ans))
            throw Error();

        d.value = ans;
    } catch {
        d.value = "Error";
    }
}
</script>

</body>
</html>
